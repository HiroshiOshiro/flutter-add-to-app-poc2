buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        // Flutter統合のために新規に書くコードはKotlinで書く。
        // 既存のJavaと同一Gradleモジュール内で共存でき、相互に呼び出せる。
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20'
    }
}
